<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04070f;
  --surface: #080d18;
  --surface2: #0d1424;
  --border: #152035;
  --text: #c8d8ea;
  --muted: #3d5470;
  --dim: #192840;

  --c-alkali:      #ff6b6b;
  --c-alkaline:    #ff9f43;
  --c-transition:  #54a0ff;
  --c-post:        #1dd1a1;
  --c-metalloid:   #b983ff;
  --c-nonmetal:    #48dbfb;
  --c-halogen:     #ffd32a;
  --c-noble:       #0be881;
  --c-lanthanide:  #9980fa;
  --c-actinide:    #ff6b81;
  --c-unknown:     #485460;

  --panel-w: 440px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Deep space background */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(84,160,255,.04) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(11,232,129,.03) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 80%, rgba(255,107,107,.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
header {
  position: relative;
  z-index: 1;
  padding: 20px 28px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  background: rgba(4,7,15,.8);
  backdrop-filter: blur(10px);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.header-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg, #54a0ff22, #0be88122);
  border: 1px solid rgba(84,160,255,.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
header h1 {
  font-size: 1rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: -.01em;
}
header p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 400;
}

/* ── LEGEND ── */
.legend {
  position: relative; z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  padding: 10px 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(4,7,15,.6);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 20px;
  border: 1px solid transparent;
  transition: all .18s;
  font-weight: 500;
}
.legend-item:hover {
  color: var(--text);
  border-color: var(--border);
  background: rgba(255,255,255,.04);
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── TABLE SCROLL WRAPPER ── */
.table-scroll {
  position: relative; z-index: 1;
  overflow-x: auto;
  padding: 20px 16px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

/* ── GRID ── */
.pt-grid {
  display: grid;
  grid-template-columns: repeat(18, 1fr);
  gap: 3px;
  min-width: 720px;
  width: 100%;
}

/* ── ELEMENT TILE ── */
.el {
  aspect-ratio: 1;
  border-radius: 5px;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 2px;
  border: 1px solid;
  transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s, opacity .2s;
  min-width: 0;
  overflow: hidden;
}

/* Shimmer line across top of each tile */
.el::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
  border-radius: 1px;
}

.el:hover {
  transform: scale(1.22) translateY(-2px);
  z-index: 10;
}
.el.active {
  transform: scale(1.18) translateY(-1px);
  z-index: 11;
  outline: 2px solid #fff;
  outline-offset: 1px;
}
.el .an {
  font-family: 'Space Mono', monospace;
  font-size: clamp(5px, .9vw, 7px);
  line-height: 1;
  opacity: .6;
}
.el .sym {
  font-weight: 700;
  font-size: clamp(9px, 1.7vw, 15px);
  line-height: 1;
  color: #fff;
  text-shadow: 0 0 12px currentColor;
}
.el .nm {
  font-size: clamp(3.5px, .65vw, 6px);
  line-height: 1;
  opacity: .6;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  max-width: 100%;
  text-overflow: ellipsis;
}

/* gap spacers */
.gap { background: none !important; border-color: transparent !important; cursor: default !important; pointer-events: none; }
.gap::before { display: none; }
.gap:hover { transform: none !important; }

/* ── CATEGORY COLORS — richer glows ── */
.cat-alkali {
  background: linear-gradient(145deg, rgba(255,107,107,.18), rgba(255,107,107,.08));
  border-color: rgba(255,107,107,.35);
  color: var(--c-alkali);
}
.cat-alkali:hover { box-shadow: 0 0 20px rgba(255,107,107,.5), 0 4px 24px rgba(0,0,0,.6); }
.cat-alkali.active { box-shadow: 0 0 24px rgba(255,107,107,.6); }

.cat-alkaline {
  background: linear-gradient(145deg, rgba(255,159,67,.18), rgba(255,159,67,.08));
  border-color: rgba(255,159,67,.35);
  color: var(--c-alkaline);
}
.cat-alkaline:hover { box-shadow: 0 0 20px rgba(255,159,67,.5), 0 4px 24px rgba(0,0,0,.6); }

.cat-transition {
  background: linear-gradient(145deg, rgba(84,160,255,.18), rgba(84,160,255,.08));
  border-color: rgba(84,160,255,.35);
  color: var(--c-transition);
}
.cat-transition:hover { box-shadow: 0 0 20px rgba(84,160,255,.5), 0 4px 24px rgba(0,0,0,.6); }

.cat-post {
  background: linear-gradient(145deg, rgba(29,209,161,.18), rgba(29,209,161,.08));
  border-color: rgba(29,209,161,.35);
  color: var(--c-post);
}
.cat-post:hover { box-shadow: 0 0 20px rgba(29,209,161,.5), 0 4px 24px rgba(0,0,0,.6); }

.cat-metalloid {
  background: linear-gradient(145deg, rgba(185,131,255,.18), rgba(185,131,255,.08));
  border-color: rgba(185,131,255,.35);
  color: var(--c-metalloid);
}
.cat-metalloid:hover { box-shadow: 0 0 20px rgba(185,131,255,.5), 0 4px 24px rgba(0,0,0,.6); }

.cat-nonmetal {
  background: linear-gradient(145deg, rgba(72,219,251,.18), rgba(72,219,251,.08));
  border-color: rgba(72,219,251,.35);
  color: var(--c-nonmetal);
}
.cat-nonmetal:hover { box-shadow: 0 0 20px rgba(72,219,251,.5), 0 4px 24px rgba(0,0,0,.6); }

.cat-halogen {
  background: linear-gradient(145deg, rgba(255,211,42,.18), rgba(255,211,42,.08));
  border-color: rgba(255,211,42,.35);
  color: var(--c-halogen);
}
.cat-halogen:hover { box-shadow: 0 0 20px rgba(255,211,42,.5), 0 4px 24px rgba(0,0,0,.6); }

.cat-noble {
  background: linear-gradient(145deg, rgba(11,232,129,.18), rgba(11,232,129,.08));
  border-color: rgba(11,232,129,.35);
  color: var(--c-noble);
}
.cat-noble:hover { box-shadow: 0 0 20px rgba(11,232,129,.5), 0 4px 24px rgba(0,0,0,.6); }

.cat-lanthanide {
  background: linear-gradient(145deg, rgba(153,128,250,.18), rgba(153,128,250,.08));
  border-color: rgba(153,128,250,.35);
  color: var(--c-lanthanide);
}
.cat-lanthanide:hover { box-shadow: 0 0 20px rgba(153,128,250,.5), 0 4px 24px rgba(0,0,0,.6); }

.cat-actinide {
  background: linear-gradient(145deg, rgba(255,107,129,.18), rgba(255,107,129,.08));
  border-color: rgba(255,107,129,.35);
  color: var(--c-actinide);
}
.cat-actinide:hover { box-shadow: 0 0 20px rgba(255,107,129,.5), 0 4px 24px rgba(0,0,0,.6); }

.cat-unknown {
  background: linear-gradient(145deg, rgba(72,84,96,.18), rgba(72,84,96,.08));
  border-color: rgba(72,84,96,.3);
  color: var(--c-unknown);
}
.cat-unknown:hover { box-shadow: 0 0 16px rgba(72,84,96,.4), 0 4px 24px rgba(0,0,0,.6); }

/* ── DETAIL PANEL ── */
.panel-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 200;
  backdrop-filter: blur(3px);
}
.panel-overlay.open { display: block; }

.panel {
  position: fixed;
  top: 0; right: 0;
  width: min(var(--panel-w), 100vw);
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 201;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}
.panel.open { transform: translateX(0); }

/* colored gradient header that changes per element */
.panel-top {
  flex-shrink: 0;
  padding: 28px 28px 24px;
  position: relative;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.panel-top::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: .12;
  pointer-events: none;
  transition: background .3s;
}
.panel-bg-glow {
  position: absolute;
  top: -40px; right: -40px;
  width: 180px; height: 180px;
  border-radius: 50%;
  opacity: .18;
  filter: blur(40px);
  transition: background .3s;
  pointer-events: none;
}
.panel-close {
  position: absolute;
  top: 18px; right: 18px;
  width: 30px; height: 30px;
  background: rgba(255,255,255,.06);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 2;
  transition: all .15s;
}
.panel-close:hover { color: #fff; border-color: var(--muted); background: rgba(255,255,255,.1); }

.panel-sym-row {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 10px;
  position: relative; z-index: 1;
}
.panel-sym {
  font-size: 5rem;
  font-weight: 700;
  line-height: 1;
  color: #fff;
  text-shadow: 0 0 40px currentColor;
  transition: color .3s, text-shadow .3s;
}
.panel-an-badge {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  padding-bottom: 10px;
}
.panel-name {
  font-size: 1.25rem;
  font-weight: 600;
  color: #fff;
  margin-bottom: 10px;
  position: relative; z-index: 1;
}
.panel-cat-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-family: 'Space Mono', monospace;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid;
  margin-bottom: 20px;
  position: relative; z-index: 1;
}
.pill-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
.panel-nums {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  position: relative; z-index: 1;
}
.panel-num {
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.panel-num .pn-label {
  font-size: 9px;
  font-family: 'Space Mono', monospace;
  color: var(--muted);
  margin-bottom: 4px;
  display: block;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.panel-num .pn-val {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  font-family: 'Space Mono', monospace;
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 22px 28px 32px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.detail-section { margin-bottom: 22px; }
.detail-section:last-child { margin-bottom: 0; }

.detail-label {
  font-size: 9px;
  font-family: 'Space Mono', monospace;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.detail-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.detail-config {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--text);
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  line-height: 1.7;
  word-break: break-word;
}
.detail-config .noble-part { color: var(--muted); }
.detail-config .valence-part { color: #fff; font-weight: 700; }

.detail-text {
  font-size: 14px;
  color: var(--text);
  line-height: 1.7;
}
.detail-text strong { color: #fff; }

.real-world-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.real-world-list li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 13.5px;
  color: var(--text);
  line-height: 1.6;
  background: rgba(255,255,255,.025);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  transition: background .15s, border-color .15s;
}
.real-world-list li:hover {
  background: rgba(255,255,255,.045);
  border-color: rgba(255,255,255,.1);
}
.rw-icon {
  font-size: 15px;
  min-width: 20px;
  margin-top: 1px;
}

/* ── SEARCH ── */
.search-wrap { position: relative; }
.search-wrap input {
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px 8px 34px;
  border-radius: 20px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  width: 190px;
  transition: border-color .15s, background .15s;
}
.search-wrap input:focus {
  outline: none;
  border-color: var(--muted);
  background: rgba(255,255,255,.07);
}
.search-wrap input::placeholder { color: var(--dim); }
.search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 13px;
  pointer-events: none;
}

.el.dimmed {
  opacity: .1;
  transform: none !important;
  filter: grayscale(.8);
}
.el.dimmed:hover { opacity: .1; transform: none !important; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-icon">⚛</div>
    <div>
      <h1>Periodic Table of Elements</h1>
      <p>Click any element · filter by category · search by name or symbol</p>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search elements..." oninput="searchElements(this.value)">
  </div>
</header>

<div class="legend" id="legend"></div>

<div class="table-scroll">
  <div class="pt-grid" id="pt-grid"></div>
</div>

<!-- OVERLAY + PANEL -->
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-top" id="panel-top">
    <div class="panel-bg-glow" id="p-glow"></div>
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div class="panel-sym-row">
      <div class="panel-sym" id="p-sym"></div>
      <div class="panel-an-badge" id="p-an-badge"></div>
    </div>
    <div class="panel-name" id="p-name"></div>
    <div class="panel-cat-pill" id="p-cat">
      <span class="pill-dot" id="p-pill-dot"></span>
      <span id="p-cat-text"></span>
    </div>
    <div class="panel-nums">
      <div class="panel-num">
        <span class="pn-label">Atomic #</span>
        <span class="pn-val" id="p-an"></span>
      </div>
      <div class="panel-num">
        <span class="pn-label">Mass</span>
        <span class="pn-val" id="p-mass"></span>
      </div>
      <div class="panel-num">
        <span class="pn-label">Period · Group</span>
        <span class="pn-val" id="p-pg"></span>
      </div>
    </div>
  </div>
  <div class="panel-body">
    <div class="detail-section">
      <span class="detail-label">Electron Configuration</span>
      <div class="detail-config" id="p-config"></div>
    </div>
    <div class="detail-section">
      <span class="detail-label">About</span>
      <div class="detail-text" id="p-about"></div>
    </div>
    <div class="detail-section">
      <span class="detail-label">Real World</span>
      <ul class="real-world-list" id="p-rw"></ul>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// ELEMENT DATA
// ═══════════════════════════════════════════════════════════
const CAT = {

// PERIODIC TABLE LAYOUT
// Grid positions: [Z, col, row]  (1-indexed)
// ═══════════════════════════════════════════════════════════
// Build a Z→position map
// Standard layout: period = row, group = col
// Special: lanthanides row 9, actinides row 10
const LAYOUT = {};
// All elements with their standard group
const STANDARD = {
  1:1,   2:18,
  3:1,   4:2,   5:13,  6:14,  7:15,  8:16,  9:17,  10:18,
  11:1,  12:2,  13:13, 14:14, 15:15, 16:16, 17:17, 18:18,
  19:1,  20:2,  21:3,  22:4,  23:5,  24:6,  25:7,  26:8,  27:9, 28:10, 29:11, 30:12, 31:13, 32:14, 33:15, 34:16, 35:17, 36:18,
  37:1,  38:2,  39:3,  40:4,  41:5,  42:6,  43:7,  44:8,  45:9, 46:10, 47:11, 48:12, 49:13, 50:14, 51:15, 52:16, 53:17, 54:18,
  55:1,  56:2,                                                                                        81:13, 82:14, 83:15, 84:16, 85:17, 86:18,
  87:1,  88:2,                                                                                        113:13,114:14,115:15,116:16,117:17,118:18,
  // period 6 transition: 71-80 (after lanthanides)
  71:3,72:4,73:5,74:6,75:7,76:8,77:9,78:10,79:11,80:12,
  // period 7 transition: 103-112
  103:3,104:4,105:5,106:6,107:7,108:8,109:9,110:10,111:11,112:12,
};
// Lanthanides: Z 57-70, row 9, cols 3-16
for(let z=57,c=3;z<=70;z++,c++) LAYOUT[z]={r:9,c};
// Actinides: Z 89-102, row 10, cols 3-16
for(let z=89,c=3;z<=102;z++,c++) LAYOUT[z]={r:10,c};

// Map ELEMENTS by Z for quick lookup
const EL_BY_Z = {};
ELEMENTS.forEach(e => EL_BY_Z[e[0]] = e);

// ═══════════════════════════════════════════════════════════
// BUILD LEGEND
// ═══════════════════════════════════════════════════════════
function buildLegend() {
  const leg = document.getElementById('legend');
  Object.entries(CAT).forEach(([key, val]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${val.color}"></div>${val.label}`;
    item.onclick = () => highlightCategory(key);
    leg.appendChild(item);
  });
}

// ═══════════════════════════════════════════════════════════
// BUILD GRID
// ═══════════════════════════════════════════════════════════
function buildGrid() {
  const grid = document.getElementById('pt-grid');

  // We build a 10-row × 18-col map
  // Rows 1-7 = periods 1-7
  // Row 8 = spacer (lanthanide/actinide gap labels)
  // Rows 9-10 = lanthanides / actinides

  const cells = {}; // key: `r,c`

  ELEMENTS.forEach(e => {
    const z = e[0], cat = e[4], period = e[5], group = e[6];
    let r, c;
    if (LAYOUT[z]) { r = LAYOUT[z].r; c = LAYOUT[z].c; }
    else if (STANDARD[z]) { r = period; c = STANDARD[z]; }
    else return;
    cells[`${r},${c}`] = e;
  });

  // Render row by row
  for (let r = 1; r <= 10; r++) {
    if (r === 8) {
      // Spacer row: lanthanide / actinide reference tiles
      for (let c = 1; c <= 18; c++) {
        const cell = document.createElement('div');
        cell.style.aspectRatio = '1';
        if (c === 3) {
          cell.style.cssText = 'grid-column:3/4;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-size:9px;color:var(--muted);font-family:DM Mono,monospace;white-space:nowrap;';
          cell.textContent = '57-71';
        } else if (c === 4) {
          cell.style.cssText = 'display:flex;align-items:center;font-size:9px;color:var(--muted);font-family:DM Mono,monospace;';
          cell.textContent = '89-103';
        } else {
          cell.style.cssText = 'background:none;';
        }
        grid.appendChild(cell);
      }
      continue;
    }

    for (let c = 1; c <= 18; c++) {
      const e = cells[`${r},${c}`];
      const tile = document.createElement('div');
      if (e) {
        const catKey = e[4];
        const catObj = CAT[catKey] || CAT.unknown;
        tile.className = `el ${catObj.cls}`;
        tile.dataset.z = e[0];
        tile.dataset.cat = catKey;
        tile.innerHTML = `
          <span class="an">${e[0]}</span>
          <span class="sym">${e[1]}</span>
          <span class="nm">${e[2]}</span>
        `;
        tile.onclick = () => openPanel(e[0]);
      } else {
        tile.className = 'el gap';
        tile.style.background = 'none';
        tile.style.border = 'none';
      }
      grid.appendChild(tile);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════════════════════
let activeZ = null;

function openPanel(z) {
  const e = EL_BY_Z[z];
  if (!e) return;

  document.querySelectorAll('.el.active').forEach(el => el.classList.remove('active'));
  document.querySelector(`.el[data-z="${z}"]`)?.classList.add('active');
  activeZ = z;

  const [Z, sym, name, mass, catKey, period, group, config, about, rw] = e;
  const catObj = CAT[catKey] || CAT.unknown;
  const col = catObj.color;

  // Symbol + glow
  const symEl = document.getElementById('p-sym');
  symEl.textContent = sym;
  symEl.style.color = col;
  symEl.style.textShadow = `0 0 40px ${col}`;

  document.getElementById('p-an-badge').textContent = `Z = ${Z}`;
  document.getElementById('p-name').textContent = name;

  // Pill
  const pill = document.getElementById('p-cat');
  pill.style.color = col;
  pill.style.borderColor = col + '55';
  pill.style.background = col + '18';
  document.getElementById('p-pill-dot').style.background = col;
  document.getElementById('p-cat-text').textContent = catObj.label;

  // Background glow bubble
  document.getElementById('p-glow').style.background = col;

  document.getElementById('p-an').textContent = Z;
  document.getElementById('p-mass').textContent = mass % 1 === 0 ? `(${mass})` : mass;
  document.getElementById('p-pg').textContent = `${period} · ${group}`;

  // Electron config
  const configHTML = config.replace(/(\[.*?\])\s*(.*)/, (_, noble, valence) => {
    if (valence) return `<span class="noble-part">${noble} </span><span class="valence-part">${valence}</span>`;
    return `<span class="valence-part">${_}</span>`;
  });
  document.getElementById('p-config').innerHTML = configHTML || `<span class="valence-part">${config}</span>`;

  document.getElementById('p-about').innerHTML = about;

  const rwEl = document.getElementById('p-rw');
  rwEl.innerHTML = rw.map(item => {
    const icon = item.match(/^(\S+)/)?.[1] || '•';
    const text = item.replace(/^\S+\s*/, '');
    return `<li><span class="rw-icon">${icon}</span><span>${text}</span></li>`;
  }).join('');

  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.el.active').forEach(el => el.classList.remove('active'));
  activeZ = null;
}

// ═══════════════════════════════════════════════════════════
// HIGHLIGHT CATEGORY
// ═══════════════════════════════════════════════════════════
let activeFilter = null;
function highlightCategory(cat) {
  if (activeFilter === cat) {
    // Toggle off
    document.querySelectorAll('.el').forEach(el => el.classList.remove('dimmed'));
    activeFilter = null;
    return;
  }
  activeFilter = cat;
  document.querySelectorAll('.el:not(.gap)').forEach(el => {
    el.classList.toggle('dimmed', el.dataset.cat !== cat);
  });
}

// ═══════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════
function searchElements(val) {
  const q = val.trim().toLowerCase();
  if (!q) {
    document.querySelectorAll('.el:not(.gap)').forEach(el => el.classList.remove('dimmed'));
    activeFilter = null;
    return;
  }
  activeFilter = '__search__';
  document.querySelectorAll('.el:not(.gap)').forEach(el => {
    const z = parseInt(el.dataset.z);
    const e = EL_BY_Z[z];
    if (!e) return;
    const match = e[1].toLowerCase().includes(q) || e[2].toLowerCase().includes(q) || String(z).includes(q);
    el.classList.toggle('dimmed', !match);
  });
}

// ═══════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});

// INIT
// ═══════════════════════════════════════════════════════════
buildLegend();
buildGrid();
</script>
